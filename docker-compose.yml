name: crm

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    ports:
      # Published on 5433 so it does not collide with a PostgreSQL already
      # installed on the host at 5432.
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
    environment:
      ENVIRONMENT: local
      DEBUG: "true"
      # Service names, not localhost: inside the network each container is its
      # own host.
      DATABASE_URL: postgresql+asyncpg://crm:crm@db:5432/crm
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/src:/app/src
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Migrations run on start so `docker compose up` gives a usable API rather
    # than one pointed at an empty schema. Split this out into a job before
    # running more than one replica.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn crm.main:app --host 0.0.0.0 --port 8000"

volumes:
  db_data:
  redis_data:
